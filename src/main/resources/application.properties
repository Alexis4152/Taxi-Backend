spring.application.name=taxiapp-backend
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taxiapp_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:1800000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:28800000}

# Patrones de origen permitido (no exactos): incluye rangos de IP de red local comunes para poder
# abrir el frontend desde un celular por HTTPS/IP local durante pruebas, ademas de localhost.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://localhost:5173,https://192.168.*.*:5173,https://10.*.*.*:5173,https://172.*.*.*:5173}
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.samesite=${APP_COOKIE_SAMESITE:Lax}

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}

# Fotos de operadores/pasajeros/taxis y logos de organizacion.
# Dev: carpeta ./uploads dentro del proyecto. Prod (Coolify): cada redeploy levanta un contenedor
# nuevo desde cero, asi que una ruta relativa se pierde en cada deploy. Montar un volumen
# persistente en Coolify (pestana "Persistent Storage") en una ruta absoluta (ej. /data/uploads)
# y apuntar UPLOADS_DIR=/data/uploads: mientras el volumen exista, las imagenes sobreviven.
app.uploads.dir=${UPLOADS_DIR:./uploads}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

app.dispatch.search-radius-km=${DISPATCH_RADIUS_KM:6}
app.dispatch.max-offers=${DISPATCH_MAX_OFFERS:5}
app.dispatch.offer-ttl-seconds=${DISPATCH_OFFER_TTL_SECONDS:20}
# Minutos antes de la hora programada en que un viaje empieza a buscar operador.
app.dispatch.schedule-lead-minutes=${DISPATCH_SCHEDULE_LEAD_MINUTES:10}
app.dispatch.scheduled-check-interval-ms=${DISPATCH_SCHEDULE_CHECK_MS:30000}
# Si un viaje se quedo sin operadores cercanos, se reintenta cada cierto tiempo con un radio mas
# amplio (multiplicado por este factor), hasta por la cantidad de intentos indicada.
app.dispatch.retry-interval-ms=${DISPATCH_RETRY_MS:20000}
app.dispatch.retry-radius-multiplier=${DISPATCH_RETRY_RADIUS_MULTIPLIER:2.0}
app.dispatch.retry-max-attempts=${DISPATCH_RETRY_MAX_ATTEMPTS:4}

app.routing.provider=${ROUTING_PROVIDER:osrm}
app.routing.osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
app.routing.http-timeout-ms=${ROUTING_HTTP_TIMEOUT_MS:5000}

app.geocoding.provider=${GEOCODING_PROVIDER:nominatim}
app.geocoding.nominatim.base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
app.geocoding.contact-email=${GEOCODING_CONTACT_EMAIL:apineda@bitfx.mx}
app.geocoding.http-timeout-ms=${GEOCODING_HTTP_TIMEOUT_MS:5000}

app.seed.enabled=${SEED_ENABLED:true}
app.seed.super-admin-phone=${SEED_ADMIN_PHONE:5550000000}
app.seed.super-admin-password=${SEED_ADMIN_PASSWORD:Admin123!}
app.seed.super-admin-email=${SEED_ADMIN_EMAIL:apineda@bitfx.mx}

logging.level.com.bitfx.taxi=INFO
logging.level.org.springframework.security=WARN
